<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2566"/>
      <stop offset="100%" stop-color="#141436"/>
    </linearGradient>
  </defs>
  <!-- app-tile container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bg)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- isometric glass cube -->
  <!-- top face (brightest) -->
  <polygon points="50,24 76,39 50,54 24,39" fill="#c8dcff" opacity="0.92"/>
  <!-- left face (front, carries N) -->
  <polygon points="24,39 50,54 50,82 24,67" fill="#7aa2ff" opacity="0.82"/>
  <!-- right face (shadow) -->
  <polygon points="76,39 50,54 50,82 76,67" fill="#4a5bb0" opacity="0.7"/>
  <!-- edges -->
  <g stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <polygon points="50,24 76,39 50,54 24,39"/>
    <polygon points="24,39 50,54 50,82 24,67"/>
    <polygon points="76,39 50,54 50,82 76,67"/>
  </g>
  <!-- N on the front-left face -->
  <text x="37" y="68" font-family="'Clash Display','Helvetica Neue',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" transform="skewY(11.3) translate(0,-4)">N</text>
</svg>
